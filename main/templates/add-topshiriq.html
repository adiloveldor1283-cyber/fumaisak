{% extends 'baseadmin.html' %}
{% load static %}

{% block title %}Yangi topshiriq yaratish | VLE Tizimi{% endblock %}

{% block extra_css %}
<style>
    .form-card {
        background: rgba(255, 255, 255, 0.01);
        border: 1px solid rgba(255, 255, 255, 0.04);
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        max-width: 600px;
        width: 100%;
        margin: 0 auto;
    }

    .form-group {
        margin-bottom: 22px;
    }

    .form-group label {
        display: block;
        font-size: 12px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.4);
        text-transform: uppercase;
        margin-bottom: 8px;
        letter-spacing: 0.5px;
    }

    .form-control {
        width: 100%;
        padding: 12px 18px;
        font-size: 14px;
        background: rgba(255,255,255,0.02);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        color: white;
        outline: none;
        transition: 0.3s;
    }
    .form-control:focus {
        border-color: #00f2fe;
        box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }
    select.form-control option {
        background: #0c101d;
        color: white;
    }

    .tugmalar {
        display: flex;
        gap: 12px;
        margin-top: 30px;
    }

    .btn-submit {
        flex: 1;
        padding: 12px 24px;
        background: linear-gradient(135deg, #00f2fe, #4facfe);
        color: #070a12;
        font-weight: 800;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
        text-transform: uppercase;
        text-align: center;
    }
    .btn-submit:hover {
        box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }

    .btn-cancel {
        flex: 1;
        padding: 12px 24px;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.15);
        color: white;
        border-radius: 12px;
        cursor: pointer;
        transition: 0.3s;
        font-weight: 800;
        text-transform: uppercase;
        text-decoration: none;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .btn-cancel:hover {
        background: rgba(255, 255, 255, 0.1);
    }

    @media (max-width: 768px) {
        .sarlavha-qatori {
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
        }
        .btn-otish {
            width: 100%;
        }
        .form-card {
            padding: 20px;
        }
        .tugmalar {
            flex-direction: column;
        }
        .btn-submit, .btn-cancel {
            width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="sarlavha-qatori" style="display: flex; align-items: center; gap: 15px; margin-bottom: 25px;">
    <a href="{% url 'admin_assignment_list' %}" class="back-arrow-btn" title="Orqaga">
        <i class="fas fa-chevron-left"></i>
    </a>
    <h2 class="sarlavha" style="font-size: 22px; font-weight: 800; color: #ffffff; border-left: 4px solid #00f2fe; padding-left: 12px; letter-spacing: -0.5px; margin-bottom: 0;">Yangi topshiriq yaratish</h2>
</div>

<div class="form-card">
    <form method="POST" enctype="multipart/form-data">
        {% csrf_token %}

        <div class="form-group">
            <label for="title">Topshiriq nomi *</label>
            <input type="text" class="form-control" id="title" name="title" required>
        </div>

        <div class="form-group">
            <label for="guruh-tanla">Guruhni tanlang *</label>
            <select class="form-control" id="guruh-tanla" name="group_id" required>
                {% for group in groups %}
                    <option value="{{ group.id }}">{{ group.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="teacher-tanla">O'qituvchini tanlang *</label>
            <select class="form-control" id="teacher-tanla" name="teacher_id" required>
                {% for teacher in teachers %}
                    <option value="{{ teacher.id }}">{{ teacher.get_full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-group">
            <label for="topshiriq-data">Topshiriq muddati *</label>
            <input type="datetime-local" class="form-control" id="topshiriq-data" name="deadline" required style="padding: 10px;">
        </div>

        <div class="form-group">
            <label for="max-ball">Topshiriq uchun eng yuqori ball *</label>
            <input type="number" class="form-control" id="max-ball" name="max_score" required>
        </div>

        <div class="form-group">
            <label for="topshiriq-file">Topshiriq fayli (ixtiyoriy)</label>
            <input type="file" class="form-control" id="topshiriq-file" name="file" style="padding: 10px;">
        </div>

        <div class="tugmalar">
            <button type="submit" class="btn-submit"><i class="fas fa-save" style="margin-right: 6px;"></i> Topshiriqni saqlash</button>
            <a href="{% url 'admin_assignment_list' %}" class="btn-cancel">Bekor qilish</a>
        </div>
    </form>
</div>
{% endblock %}

{% block extra_js %}
<!-- Maxsus JS logic, agar kerak bo'lsa -->
{% endblock %}
