{% extends "baseadmin.html" %}

{% block title %}{{ title_text }} | VLE Tizimi{% endblock %}

{% block content %}
<div style="padding: 24px; display: flex; flex-direction: column; height: 100%; overflow-y: auto;">
    
    <!-- Sarlavha paneli -->
    <div style="margin-bottom: 24px; display: flex; align-items: center; gap: 12px;">
        <a href="{% url 'announcement_list' %}" title="Orqaga" style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); color: #00f2fe; border-radius: 12px; width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s;" onmouseover="this.style.background='rgba(0, 242, 254, 0.1)';" onmouseout="this.style.background='rgba(255,255,255,0.03)';">
            <i class="fas fa-chevron-left" style="font-size: 16px;"></i>
        </a>
        <div>
            <h2 style="color: #ffffff; font-size: 24px; font-weight: 800; margin-bottom: 4px; letter-spacing: 0.5px;">{{ title_text }}</h2>
            <p style="color: rgba(255,255,255,0.5); font-size: 13.5px; font-weight: 500;">Tizim xabari ma'lumotlarini to'ldiring</p>
        </div>
    </div>

    <!-- FORMATLANGAN FORMA QUTISI -->
    <div style="max-width: 680px; background: rgba(11, 15, 25, 0.4); border: 1px solid rgba(255,255,255,0.05); border-radius: 20px; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 20px 40px rgba(0,0,0,0.3); padding: 30px;">
        
        <form method="POST" style="display: flex; flex-direction: column; gap: 20px;">
            {% csrf_token %}
            
            <!-- Xabar sarlavhasi -->
            <div>
                <label for="title" style="display: block; color: rgba(255,255,255,0.7); font-size: 13.5px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Sarlavha <span style="color: #ff3366;">*</span></label>
                <input type="text" id="title" name="title" required value="{{ announcement.title|default:'' }}" placeholder="Masalan: Tizimda profilaktika ishlari yoki yangilanish" style="width: 100%; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); color: #ffffff; font-size: 14.5px; font-weight: 600; transition: 0.3s; outline: none;" onfocus="this.style.borderColor='#00f2fe'; this.style.boxShadow='0 0 10px rgba(0,242,254,0.15)';" onblur="this.style.borderColor='rgba(255,255,255,0.08)'; this.style.boxShadow='none';">
            </div>

            <!-- Xabar matni -->
            <div>
                <label for="message" style="display: block; color: rgba(255,255,255,0.7); font-size: 13.5px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Xabar matni <span style="color: #ff3366;">*</span></label>
                <textarea id="message" name="message" required rows="4" placeholder="Foydalanuvchilarga ko'rsatiladigan to'liq e'lon matnini yozing..." style="width: 100%; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); color: #ffffff; font-size: 14.5px; font-weight: 600; transition: 0.3s; outline: none; resize: vertical; font-family: inherit;" onfocus="this.style.borderColor='#00f2fe'; this.style.boxShadow='0 0 10px rgba(0,242,254,0.15)';" onblur="this.style.borderColor='rgba(255,255,255,0.08)'; this.style.boxShadow='none';">{{ announcement.message|default:'' }}</textarea>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <!-- Kimlar uchun (Target Role) -->
                <div>
                    <label for="target_role" style="display: block; color: rgba(255,255,255,0.7); font-size: 13.5px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Kimlar uchun</label>
                    <select id="target_role" name="target_role" style="width: 100%; padding: 12px 16px; border-radius: 10px; background: #0c101d; border: 1px solid rgba(255,255,255,0.08); color: #ffffff; font-size: 14.5px; font-weight: 600; outline: none; cursor: pointer; transition: 0.3s;" onfocus="this.style.borderColor='#00f2fe';" onblur="this.style.borderColor='rgba(255,255,255,0.08)';">
                        <option value="all" {% if announcement.target_role == 'all' %}selected{% endif %}>Barcha foydalanuvchilar</option>
                        <option value="teacher" {% if announcement.target_role == 'teacher' %}selected{% endif %}>Faqat o'qituvchilar</option>
                        <option value="student" {% if announcement.target_role == 'student' %}selected{% endif %}>Faqat o'quvchilar</option>
                    </select>
                </div>

                <!-- Turkum (Category) -->
                <div>
                    <label for="category" style="display: block; color: rgba(255,255,255,0.7); font-size: 13.5px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">E'lon turi</label>
                    <select id="category" name="category" style="width: 100%; padding: 12px 16px; border-radius: 10px; background: #0c101d; border: 1px solid rgba(255,255,255,0.08); color: #ffffff; font-size: 14.5px; font-weight: 600; outline: none; cursor: pointer; transition: 0.3s;" onfocus="this.style.borderColor='#00f2fe';" onblur="this.style.borderColor='rgba(255,255,255,0.08)';">
                        <option value="always_show" {% if announcement.category == 'always_show' %}selected{% endif %}>Doimiy ko'rsatish (Banner)</option>
                        <option value="one_time" {% if announcement.category == 'one_time' %}selected{% endif %}>Bir martalik (Kirganda chiqadi)</option>
                    </select>
                </div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <!-- Boshlanish vaqti -->
                <div>
                    <label for="start_time" style="display: block; color: rgba(255,255,255,0.7); font-size: 13.5px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Boshlanish vaqti</label>
                    <input type="datetime-local" id="start_time" name="start_time" value="{{ st_iso }}" style="width: 100%; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); color: #ffffff; font-size: 14.5px; font-weight: 600; outline: none; transition: 0.3s;" onfocus="this.style.borderColor='#00f2fe';" onblur="this.style.borderColor='rgba(255,255,255,0.08)';">
                </div>

                <!-- Tugash vaqti -->
                <div>
                    <label for="end_time" style="display: block; color: rgba(255,255,255,0.7); font-size: 13.5px; font-weight: 700; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px;">Tugash vaqti <span style="color: #ff3366;">*</span></label>
                    <input type="datetime-local" id="end_time" name="end_time" required value="{{ et_iso }}" style="width: 100%; padding: 12px 16px; border-radius: 10px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); color: #ffffff; font-size: 14.5px; font-weight: 600; outline: none; transition: 0.3s;" onfocus="this.style.borderColor='#00f2fe';" onblur="this.style.borderColor='rgba(255,255,255,0.08)';">
                </div>
            </div>

            <!-- Faollik (Is Active) -->
            <div style="display: flex; align-items: center; gap: 10px; margin-top: 10px;">
                <input type="checkbox" id="is_active" name="is_active" {% if announcement.is_active|default:True %}checked{% endif %} style="width: 18px; height: 18px; accent-color: #00f2fe; cursor: pointer;">
                <label for="is_active" style="color: rgba(255,255,255,0.85); font-size: 14px; font-weight: 600; cursor: pointer; user-select: none;">E'lon faol holatda (Ko'rsatishni boshlash)</label>
            </div>

            <!-- Amal tugmalari -->
            <div style="display: flex; gap: 15px; margin-top: 20px;">
                <a href="{% url 'announcement_list' %}" class="btn-cancel" style="flex: 1; text-align: center; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14.5px; transition: 0.2s;">Bekor qilish</a>
                <button type="submit" style="flex: 1.5; background: linear-gradient(135deg, #00f2fe, #4facfe); border: none; color: #070a12; padding: 14px; border-radius: 12px; font-weight: 700; font-size: 14.5px; cursor: pointer; box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3); transition: 0.3s;" onmouseover="this.style.transform='translateY(-2px)';" onmouseout="this.style.transform='none';">{{ button_text }}</button>
            </div>

        </form>
    </div>
</div>
{% endblock %}
