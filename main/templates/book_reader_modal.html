    .flipbook-stage {

    .flipbook {
        position: relative;
        width: 860px;
        height: 590px;
        max-width: 92vw;
        max-height: 74vh;
        transform-style: preserve-3d;

    #book-reader-modal.dark-reader .flipbook {

    /* Center crease / spine shadow overlay */
    .flipbook::before {
        content: '';
        position: absolute;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        background: linear-gradient(to right, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.03) 48%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.03) 52%, rgba(0,0,0,0.12) 100%);

        pointer-events: none;
        border-radius: 8px;
    }

    .book-sheet {
        position: absolute;
        right: 0;
        top: 0;
        width: 50%;
        height: 100%;
        transform-origin: left center;
        transform-style: preserve-3d;
        transition: transform 0.75s cubic-bezier(0.25, 0.8, 0.25, 1);
        cursor: pointer;
    }

    .book-sheet.flipped {
        transform: rotateY(-180deg);
    }

    .sheet-face {
        position: absolute;
        width: 100%;
        height: 100%;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        background-color: #ffffff;
        box-shadow: inset 2px 0 12px rgba(0, 0, 0, 0.06);
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;

    .sheet-face.front {

        transform: rotateY(0deg);
        border-top-right-radius: 6px;
        border-bottom-right-radius: 6px;
    }

    .sheet-face.back {
        transform: rotateY(180deg);
        border-top-left-radius: 6px;
        border-bottom-left-radius: 6px;
        box-shadow: inset -2px 0 12px rgba(0, 0, 0, 0.06);
    }

    /* Inner spine shadow on each face */
    .sheet-face.front::after {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 22px;
        height: 100%;
        background: linear-gradient(to right, rgba(0,0,0,0.1) 0%, rgba(0,0,0,0) 100%);

    .sheet-face.back::after {

<script>
    let currentPdfDoc = null;
    let modalTotalPages = 0;
    let modalTotalSheets = 0;
    let modalCurrentSheet = 0;
    let modalZoom = 1.0;
    let modalSheets = [];
    let currentViewMode = '3d';
    let scrollRenderedPages = new Set();
    let scrollObserver = null;

    let readerModal = document.getElementById('book-reader-modal');
    let modalTitle = document.getElementById('reader-modal-title');
    let modalSubject = document.getElementById('reader-modal-subject');
    let modalDownloadBtn = document.getElementById('btn-reader-download');
    let flipbookViewport = document.getElementById('flipbook-viewport');
    let flipbookContainer = document.getElementById('flipbook-container');
    let stage3D = document.getElementById('stage-3d');
    let stageScroll = document.getElementById('stage-scroll');
    let modalPrevBtn = document.getElementById('modal-prev-btn');
    let modalNextBtn = document.getElementById('modal-next-btn');
    let modalPageInput = document.getElementById('modal-page-input');
    let modalTotalPagesSpan = document.getElementById('modal-total-pages');
    let btnMode3D = document.getElementById('btn-mode-3d');
    let btnModeScroll = document.getElementById('btn-mode-scroll');
    let btnZoomIn = document.getElementById('btn-reader-zoom-in');
    let btnZoomOut = document.getElementById('btn-reader-zoom-out');
    let btnTheme = document.getElementById('btn-reader-theme');
    let btnFullscreen = document.getElementById('btn-reader-fullscreen');
    let readerFooter = document.getElementById('reader-footer');

    function initReaderDom() {
        if (!readerModal) readerModal = document.getElementById('book-reader-modal');
        if (!modalTitle) modalTitle = document.getElementById('reader-modal-title');
        if (!modalSubject) modalSubject = document.getElementById('reader-modal-subject');
        if (!modalDownloadBtn) modalDownloadBtn = document.getElementById('btn-reader-download');
        if (!flipbookViewport) flipbookViewport = document.getElementById('flipbook-viewport');
        if (!flipbookContainer) flipbookContainer = document.getElementById('flipbook-container');
        if (!stage3D) stage3D = document.getElementById('stage-3d');
        if (!stageScroll) stageScroll = document.getElementById('stage-scroll');
        if (!modalPrevBtn) modalPrevBtn = document.getElementById('modal-prev-btn');
        if (!modalNextBtn) modalNextBtn = document.getElementById('modal-next-btn');
        if (!modalPageInput) modalPageInput = document.getElementById('modal-page-input');
        if (!modalTotalPagesSpan) modalTotalPagesSpan = document.getElementById('modal-total-pages');
        if (!btnMode3D) btnMode3D = document.getElementById('btn-mode-3d');
        if (!btnModeScroll) btnModeScroll = document.getElementById('btn-mode-scroll');
        if (!btnZoomIn) btnZoomIn = document.getElementById('btn-reader-zoom-in');
        if (!btnZoomOut) btnZoomOut = document.getElementById('btn-reader-zoom-out');
        if (!btnTheme) btnTheme = document.getElementById('btn-reader-theme');
        if (!btnFullscreen) btnFullscreen = document.getElementById('btn-reader-fullscreen');
        if (!readerFooter) readerFooter = document.getElementById('reader-footer');
    }

    // OPEN MODAL
    function openBookReaderModal(title, subject, pdfUrl) {
        initReaderDom();
        if (!readerModal) {
            console.error("Reader modal element #book-reader-modal not found.");
            window.open(pdfUrl, '_blank');
            return;
        }

        // CRITICAL: Ensure readerModal is attached directly to <body> so sidebars/containers can NEVER clip or overlay it!
        if (readerModal.parentElement !== document.body) {
            document.body.appendChild(readerModal);
            initReaderDom();
        }

        if (modalTitle) modalTitle.textContent = title || "Elektron Kitob";
        if (modalSubject) modalSubject.textContent = (subject || "Fan") + " • Elektron darslik";
        if (modalDownloadBtn) modalDownloadBtn.href = pdfUrl;

        // DEFAULT: Light / Kun rejimi
        readerModal.classList.remove('dark-reader');
        if (btnTheme) btnTheme.innerHTML = '<i class="fas fa-moon"></i>';

        // Reset state
        modalZoom = 1.0;
        modalCurrentSheet = 0;
        modalSheets = [];
        scrollRenderedPages.clear();
        if (flipbookViewport) flipbookViewport.innerHTML = '<div style="color: #0284c7; font-weight: 700; text-align: center; padding: 40px;"><div class="sheet-spinner" style="margin: 0 auto 15px auto;"></div>Kitob ochilmoqda...</div>';
        if (stageScroll) stageScroll.innerHTML = '';
        applyZoom();

        // Lock body scrolling
        document.body.style.overflow = 'hidden';
        readerModal.classList.add('active');

        switchReaderMode('3d');

        // Check PDF.js library
        const pLib = window.pdfjsLib || (typeof pdfjsLib !== 'undefined' ? pdfjsLib : null);
        if (!pLib) {
            console.warn("PDF.js library still loading, retrying in 300ms...");
            setTimeout(() => {
                const retryLib = window.pdfjsLib || (typeof pdfjsLib !== 'undefined' ? pdfjsLib : null);
                if (retryLib) {
                    loadPdfDoc(retryLib, pdfUrl);
                } else {
                    if (flipbookViewport) {
                        flipbookViewport.innerHTML = `<div style="color: #ef4444; padding: 25px; text-align: center; font-weight: 700;">
                            PDF ko'rish dasturi yuklanmadi.
                            <br><br>
                            <a href="${pdfUrl}" target="_blank" class="reader-nav-btn" style="text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                                <i class="fas fa-external-link-alt"></i> Yangi oynada ochish
                            </a>
                        </div>`;
                    }
                }
            }, 300);
            return;
        }

        loadPdfDoc(pLib, pdfUrl);
    }

    function loadPdfDoc(pLib, pdfUrl) {
        if (!pLib.GlobalWorkerOptions.workerSrc) {
            pLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
        }

        pLib.getDocument(pdfUrl).promise.then(function(pdf) {
            currentPdfDoc = pdf;
            modalTotalPages = pdf.numPages;
            modalTotalSheets = Math.ceil(modalTotalPages / 2);

            if (modalTotalPagesSpan) modalTotalPagesSpan.textContent = modalTotalPages;
            if (modalPageInput) {
                modalPageInput.max = modalTotalPages;
                modalPageInput.value = 1;
            }

            buildModalFlipbook();
            buildScrollPages();
            goToModalSheet(0);
        }).catch(function(err) {
            console.error("Error loading PDF in modal: ", err);
            if (flipbookViewport) {
                flipbookViewport.innerHTML = `<div style="color: #ef4444; padding: 25px; text-align: center; font-weight: 700;">
                    Kitobni ochib bo'lmadi (${err.message || 'Xatolik'}).
                    <br><br>
                    <a href="${pdfUrl}" target="_blank" class="reader-nav-btn" style="text-decoration:none; display:inline-flex; align-items:center; gap:6px;">
                        <i class="fas fa-external-link-alt"></i> Yangi oynada ochish
                    </a>
                </div>`;
            }
        });
    }

    // CLOSE MODAL
    function closeBookReaderModal() {
        initReaderDom();
        if (!readerModal) return;
        readerModal.classList.remove('active');
        document.body.style.overflow = '';
        currentPdfDoc = null;
        if (flipbookViewport) flipbookViewport.innerHTML = '';
        if (stageScroll) stageScroll.innerHTML = '';
        if (document.fullscreenElement) {
            document.exitFullscreen().catch(()=>{});
        }
    }

    // BUILD 3D FLIPBOOK
    function buildModalFlipbook() {
        flipbookViewport.innerHTML = '';
        modalSheets = [];

        for (let i = 0; i < modalTotalSheets; i++) {
            const frontPageNum = i * 2 + 1;
            const backPageNum = i * 2 + 2;

            const sheet = document.createElement('div');
            sheet.className = 'book-sheet';
            sheet.dataset.index = i;

            // Front Face
            const frontFace = document.createElement('div');
            frontFace.className = 'sheet-face front';
            if (frontPageNum <= modalTotalPages) {
                frontFace.appendChild(createPageSlot(frontPageNum));
            } else {
                frontFace.innerHTML = '<div style="opacity: 0.15; font-size: 32px;"><i class="fas fa-book"></i></div>';
            }

            // Back Face
            const backFace = document.createElement('div');
            backFace.className = 'sheet-face back';
            if (backPageNum <= modalTotalPages) {
                backFace.appendChild(createPageSlot(backPageNum));
            } else {
                backFace.innerHTML = '<div style="opacity: 0.15; font-size: 32px;"><i class="fas fa-book"></i></div>';
            }

            sheet.appendChild(frontFace);
            sheet.appendChild(backFace);
            flipbookViewport.appendChild(sheet);
            modalSheets.push(sheet);
        }

        // Sheet click turning
        modalSheets.forEach((sheet, idx) => {
            sheet.addEventListener('click', (e) => {
                if (e.target.closest('button') || e.target.closest('a') || e.target.closest('input')) return;
                if (idx < modalCurrentSheet) {
                    goToModalSheet(modalCurrentSheet - 1);
                } else if (idx === modalCurrentSheet) {
                    goToModalSheet(modalCurrentSheet + 1);
                }
            });
        });
    }

    function createPageSlot(pageNum) {
        const wrap = document.createElement('div');
        wrap.style.width = '100%';
        wrap.style.height = '100%';
        wrap.style.position = 'relative';
        wrap.style.display = 'flex';
        wrap.style.justifyContent = 'center';
        wrap.style.alignItems = 'center';

        const loader = document.createElement('div');
        loader.className = 'sheet-loading';
        loader.innerHTML = `
            <div class="sheet-spinner"></div>
            <div>${pageNum}-bet</div>
        `;
        wrap.appendChild(loader);

        const canvas = document.createElement('canvas');
        canvas.dataset.page = pageNum;
        canvas.style.display = 'none';
        wrap.appendChild(canvas);

        return wrap;
    }

    // GOTO SHEET IN 3D
    function goToModalSheet(sheetIndex) {
        if (sheetIndex < 0 || sheetIndex > modalTotalSheets) return;

        modalCurrentSheet = sheetIndex;

        // Position book container:
        // When at Cover (sheet 0): shift left by 25% so the single front cover is centered!
        // When open (0 < sheetIndex < totalSheets): centered at 0%
        // When at End (sheetIndex === totalSheets): shift right by 25% so the back cover is centered!
        let translateX = 0;
        if (modalCurrentSheet === 0) {
            translateX = -25;
        } else if (modalCurrentSheet === modalTotalSheets) {
            translateX = 25;
        }
        applyZoom(translateX);

        // Z-Index and Flip classes
        modalSheets.forEach((sheet, idx) => {
            if (idx < modalCurrentSheet) {
                sheet.style.zIndex = idx + 1;
                sheet.classList.add('flipped');
            } else {
                sheet.style.zIndex = modalTotalSheets - idx + 10;
                sheet.classList.remove('flipped');
            }
        });

        // Update nav buttons
        if (modalPrevBtn) modalPrevBtn.disabled = modalCurrentSheet === 0;
        if (modalNextBtn) modalNextBtn.disabled = modalCurrentSheet === modalTotalSheets;

        // Update page indicator input
        let activePage = 1;
        if (modalCurrentSheet === 0) {
            activePage = 1;
        } else if (modalCurrentSheet === modalTotalSheets) {
            activePage = modalTotalPages;
        } else {
            activePage = modalCurrentSheet * 2;
        }
        if (modalPageInput) modalPageInput.value = Math.min(activePage, modalTotalPages);

        // Lazy load visible and neighboring pages
        lazyLoadModalPages();
    }

    function lazyLoadModalPages() {
        if (!currentPdfDoc) return;
        const targetSheets = [modalCurrentSheet - 1, modalCurrentSheet, modalCurrentSheet + 1];
        
        targetSheets.forEach(sIdx => {
            if (sIdx >= 0 && sIdx < modalTotalSheets && modalSheets[sIdx]) {
                const sheet = modalSheets[sIdx];
                const canvases = sheet.querySelectorAll('canvas');
                canvases.forEach(cv => {
                    const p = parseInt(cv.dataset.page);
                    if (p && p <= modalTotalPages) {
                        renderPdfPageToCanvas(p, cv);
                    }
                });
            }
        });
    }

    function renderPdfPageToCanvas(pageNum, canvas) {
        if (canvas.dataset.rendered === 'true' || canvas.dataset.rendering === 'true') return;
        canvas.dataset.rendering = 'true';

        currentPdfDoc.getPage(pageNum).then(page => {
            const viewport = page.getViewport({ scale: 2.0 });
            const ctx = canvas.getContext('2d');
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            const renderContext = {
                canvasContext: ctx,
                viewport: viewport
            };

            page.render(renderContext).promise.then(() => {
                canvas.dataset.rendered = 'true';
                canvas.dataset.rendering = 'false';
                canvas.style.display = 'block';

                const loader = canvas.parentElement.querySelector('.sheet-loading');
                if (loader) loader.style.display = 'none';
            });
        }).catch(err => {
            console.error("Error rendering page " + pageNum, err);
            canvas.dataset.rendering = 'false';
        });
    }

    // BUILD CONTINUOUS SCROLL PAGES
    function buildScrollPages() {
        stageScroll.innerHTML = '';
        for (let p = 1; p <= modalTotalPages; p++) {
            const card = document.createElement('div');
            card.className = 'scroll-page-card';
            card.id = `scroll-page-${p}`;

            const canvas = document.createElement('canvas');
            canvas.dataset.page = p;
            card.appendChild(canvas);

            const badge = document.createElement('div');
            badge.className = 'scroll-page-num';
            badge.textContent = `${p} / ${modalTotalPages}`;
            card.appendChild(badge);

            stageScroll.appendChild(card);
        }

        setupScrollObserver();
    }

    function setupScrollObserver() {
        if (scrollObserver) scrollObserver.disconnect();

        scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const canvas = entry.target.querySelector('canvas');
                    if (canvas) {
                        const pageNum = parseInt(canvas.dataset.page);
                        if (pageNum && !scrollRenderedPages.has(pageNum)) {
                            scrollRenderedPages.add(pageNum);
                            renderPdfPageToCanvas(pageNum, canvas);
                        }
                    }
                }
            });
        }, {
            root: stageScroll,
            rootMargin: '400px 0px 400px 0px',
            threshold: 0.01
        });

        document.querySelectorAll('.scroll-page-card').forEach(el => scrollObserver.observe(el));
    }

    // SWITCH VIEW MODE
    function switchReaderMode(mode) {
        currentViewMode = mode;
        if (mode === '3d') {
            if (btnMode3D) btnMode3D.classList.add('active');
            if (btnModeScroll) btnModeScroll.classList.remove('active');
            if (stage3D) stage3D.style.display = 'flex';
            if (stageScroll) stageScroll.classList.remove('active');
            if (readerFooter) readerFooter.style.display = 'flex';
        } else {
            if (btnMode3D) btnMode3D.classList.remove('active');
            if (btnModeScroll) btnModeScroll.classList.add('active');
            if (stage3D) stage3D.style.display = 'none';
            if (stageScroll) stageScroll.classList.add('active');
            if (readerFooter) readerFooter.style.display = 'none';
            if (stageScroll && stageScroll.children.length > 0) {
                setupScrollObserver();
            }
        }
    }

    function applyZoom(customTranslateX = null) {
        if (!flipbookContainer) return;
        let tx = customTranslateX;
        if (tx === null) {
            if (modalCurrentSheet === 0) tx = -25;
            else if (modalCurrentSheet === modalTotalSheets) tx = 25;
            else tx = 0;
        }
        flipbookContainer.style.transform = `translateX(${tx}%) scale(${modalZoom})`;
    }

    // EVENT LISTENERS
    if (modalPrevBtn) {
        modalPrevBtn.addEventListener('click', () => {
            goToModalSheet(modalCurrentSheet - 1);
        });
    }

    if (modalNextBtn) {
        modalNextBtn.addEventListener('click', () => {
            goToModalSheet(modalCurrentSheet + 1);
        });
    }

    if (modalPageInput) {
        modalPageInput.addEventListener('change', () => {
            let p = parseInt(modalPageInput.value);
            if (isNaN(p) || p < 1) p = 1;
            if (p > modalTotalPages) p = modalTotalPages;
            modalPageInput.value = p;

            if (currentViewMode === '3d') {
                let targetSheet = 0;
                if (p === 1) targetSheet = 0;
                else targetSheet = Math.floor(p / 2);
                goToModalSheet(targetSheet);
            } else {
                const card = document.getElementById(`scroll-page-${p}`);
                if (card) card.scrollIntoView({ behavior: 'smooth' });
            }
        });
    }

    // ZOOM IN / OUT
    if (btnZoomIn) {
        btnZoomIn.addEventListener('click', () => {
            if (modalZoom < 1.7) {
                modalZoom += 0.15;
                applyZoom();
            }
        });
    }
    if (btnZoomOut) {
        btnZoomOut.addEventListener('click', () => {
            if (modalZoom > 0.6) {
                modalZoom -= 0.15;
                applyZoom();
            }
        });
    }

    // THEME TOGGLE (Dark / Light)
    if (btnTheme) {
        btnTheme.addEventListener('click', () => {
            readerModal.classList.toggle('dark-reader');
            const isDark = readerModal.classList.contains('dark-reader');
            btnTheme.innerHTML = isDark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });
    }

    // FULLSCREEN TOGGLE
    if (btnFullscreen) {
        btnFullscreen.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                readerModal.requestFullscreen().then(() => {
                    btnFullscreen.innerHTML = '<i class="fas fa-compress"></i>';
                }).catch(()=>{});
            } else {
                document.exitFullscreen().then(() => {
                    btnFullscreen.innerHTML = '<i class="fas fa-expand"></i>';
                }).catch(()=>{});
            }
        });
    }

    // KEYBOARD NAVIGATION
    document.addEventListener('keydown', (e) => {
        if (!readerModal || !readerModal.classList.contains('active')) return;

        if (e.key === 'Escape') {
            closeBookReaderModal();
        } else if (e.key === 'ArrowLeft') {
            if (currentViewMode === '3d') goToModalSheet(modalCurrentSheet - 1);
        } else if (e.key === 'ArrowRight') {
            if (currentViewMode === '3d') goToModalSheet(modalCurrentSheet + 1);
        }
    });

    // Expose functions globally on window
    window.openBookReaderModal = openBookReaderModal;
    window.closeBookReaderModal = closeBookReaderModal;
    window.switchReaderMode = switchReaderMode;
</script>
