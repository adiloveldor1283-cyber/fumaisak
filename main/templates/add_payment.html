{% extends 'baseadmin.html' %}
{% load static %}

{% block title %}Guruh To'lov Ma'lumotlari{% endblock %}

{% block content %}
<div class="sarlavha-qatori" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <h2 class="sarlavha" style="font-size: 22px; font-weight: 800; color: #ffffff; border-left: 4px solid #00f2fe; padding-left: 12px; letter-spacing: -0.5px; margin-bottom: 0;">{{ group.name }} - to'lov ma'lumotlari</h2>
    <a href="{% url 'group_payment_list' %}" class="btn-otish" style="display: inline-block; padding: 8px 16px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); color: #ffffff; text-decoration: none; border-radius: 8px; font-size: 13px; font-weight: 600; transition: 0.3s; text-align: center; cursor: pointer;"><i class="fas fa-arrow-left"></i> Orqaga</a>
</div>

<div class="form-card" style="background: rgba(255, 255, 255, 0.01); border: 1px solid rgba(255, 255, 255, 0.04); border-radius: 20px; padding: 30px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); max-width: 600px; width: 100%; margin: 0 auto;">
    <form method="POST">
        {% csrf_token %}

        <div class="form-group" style="margin-bottom: 22px;">
            <label for="duration" style="display: block; font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;">Kurs davomiyligi (oylarda) *</label>
            <input type="number" class="form-control" id="duration" name="duration"
                   value="{{ payment_info.course_duration_months|default:'' }}"
                   placeholder="Masalan: 6" required style="width: 100%; padding: 12px 18px; font-size: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: white; outline: none; transition: 0.3s;">
        </div>

        <div class="form-group" style="margin-bottom: 22px;">
            <label for="monthly_fee" style="display: block; font-size: 12px; font-weight: 700; color: rgba(255, 255, 255, 0.4); text-transform: uppercase; margin-bottom: 8px; letter-spacing: 0.5px;">Har oy uchun to‘lov summasi (so‘m) *</label>
            <input type="number" class="form-control" id="monthly_fee" name="monthly_fee"
                   value="{{ payment_info.monthly_fee|default:'' }}"
                   placeholder="Masalan: 300000" required style="width: 100%; padding: 12px 18px; font-size: 14px; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; color: white; outline: none; transition: 0.3s;">
        </div>

        <div class="tugmalar" style="display: flex; gap: 12px; margin-top: 30px;">
            <button type="submit" class="btn-submit" style="flex: 1; padding: 12px 24px; background: linear-gradient(135deg, #00f2fe, #4facfe); color: #070a12; font-weight: 800; border: none; border-radius: 12px; cursor: pointer; transition: 0.3s; text-transform: uppercase;"><i class="fas fa-save" style="margin-right: 6px;"></i> SAQLASH</button>
            <a href="{% url 'group_payment_list' %}" class="btn-cancel" style="flex: 1; padding: 12px 24px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.15); color: white; border-radius: 12px; cursor: pointer; transition: 0.3s; font-weight: 800; text-transform: uppercase; text-decoration: none; display: flex; align-items: center; justify-content: center;">Chiqish</a>
        </div>
    </form>
</div>
{% endblock %}
