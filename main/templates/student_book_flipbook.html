<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - 3D O'qish</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        :root {
            --bg-color: #070a13;
            --panel-bg: rgba(15, 23, 42, 0.65);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary-glow: rgba(0, 255, 170, 0.3);
            --text-color: #f8fafc;
            --accent-color: #00ffaa;
            --shadow-color: rgba(0, 0, 0, 0.6);
            --book-shadow: 0 30px 80px rgba(0, 0, 0, 0.85);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --panel-bg: rgba(255, 255, 255, 0.85);
            --panel-border: rgba(0, 0, 0, 0.08);
            --primary-glow: rgba(2, 132, 199, 0.15);
            --text-color: #0f172a;
            --accent-color: #0284c7;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --book-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 25px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            box-shadow: 0 4px 30px var(--shadow-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
            min-width: 0;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: #070a13;
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: transparent;
        }

        .book-info {
            min-width: 0;
        }

        .book-info h1 {
            font-size: 16px;
            font-weight: 800;
            letter-spacing: -0.3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 350px;
        }

        .book-info p {
            font-size: 11.5px;
            opacity: 0.6;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-center {
            display: flex;
            align-items: center;
        }

        .mode-toggle {
            display: inline-flex;
            background: rgba(0, 0, 0, 0.3);
            padding: 3px;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
        }
        body.light-mode .mode-toggle {
            background: rgba(0, 0, 0, 0.05);
        }

        .mode-btn {
            background: transparent;
            border: none;
            color: inherit;
            padding: 6px 12px;
            border-radius: 7px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            opacity: 0.6;
            transition: all 0.2s;
        }
        .mode-btn.active {
            background: var(--accent-color);
            color: #070a13;
            opacity: 1;
            box-shadow: 0 0 10px var(--primary-glow);
        }
        body.light-mode .mode-btn.active {
            color: #ffffff;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-icon-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            text-decoration: none;
            font-size: 13px;
        }

        .control-icon-btn:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--accent-color);
        }

        /* --- MAIN WORKSPACE --- */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        /* --- 3D BOOK ENGINE --- */
        .stage-3d {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 2400px;
            position: relative;
            overflow: hidden;
            padding: 20px;
        }

        .book-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
            transform-origin: center center;
        }

        .book {
            position: relative;
            width: 880px; /* Double page width */
            height: 600px; /* Page height */
            max-width: 90vw;
            max-height: 75vh;
            transform-style: preserve-3d;
            box-shadow: var(--book-shadow);
            border-radius: 8px;
            transition: transform 0.4s ease;
        }

        /* Spine crease shadow */
        .book::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.18) 0%, rgba(0,0,0,0.05) 48%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.05) 52%, rgba(0,0,0,0.18) 100%);
            z-index: 500;
            pointer-events: none;
            border-radius: 8px;
        }

        .sheet {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.75s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }

        .sheet.flipped {
            transform: rotateY(-180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-color: #ffffff;
            box-shadow: inset 2px 0 15px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .face.front {
            z-index: 2;
            transform: rotateY(0deg);
            border-top-right-radius: 6px;
            border-bottom-right-radius: 6px;
        }

        .face.back {
            transform: rotateY(180deg);
            border-top-left-radius: 6px;
            border-bottom-left-radius: 6px;
            box-shadow: inset -2px 0 15px rgba(0, 0, 0, 0.08);
        }

        /* Spine shadow overlay on page edges */
        .face.front::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 25px;
            height: 100%;
            background: linear-gradient(to right, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 10;
        }

        .face.back::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 25px;
            height: 100%;
            background: linear-gradient(to left, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0) 100%);
            pointer-events: none;
            z-index: 10;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #ffffff;
        }

        /* Blank/Loading state */
        .page-loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: #64748b;
            font-size: 12px;
            font-weight: 600;
        }

        .spinner {
            width: 26px;
            height: 26px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 0.9s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* --- CONTINUOUS SCROLL STAGE --- */
        .stage-scroll {
            width: 100%;
            height: 100%;
            overflow-y: auto;
            overflow-x: hidden;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 30px 15px;
            gap: 25px;
        }
        .stage-scroll.active {
            display: flex;
        }

        .scroll-card {
            background: #ffffff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 6px;
            overflow: hidden;
            position: relative;
            max-width: 800px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .scroll-card canvas {
            width: 100%;
            height: auto;
            display: block;
        }
        .scroll-badge {
            position: absolute;
            bottom: 10px;
            right: 15px;
            background: rgba(0,0,0,0.65);
            color: white;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            pointer-events: none;
        }

        /* --- BOTTOM CONTROLS --- */
        footer {
            padding: 12px 25px;
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -4px 30px var(--shadow-color);
        }

        .footer-hint {
            font-size: 11px;
            opacity: 0.5;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .controls-inner {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 0 auto;
        }

        .page-nav-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 8px 18px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .page-nav-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #070a13;
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: transparent;
        }

        .page-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-indicator {
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-input {
            width: 48px;
            padding: 5px 8px;
            border-radius: 7px;
            border: 1px solid var(--panel-border);
            background: rgba(0,0,0,0.3);
            color: inherit;
            text-align: center;
            font-weight: 800;
            font-size: 13px;
            outline: none;
        }
        body.light-mode .page-input {
            background: #ffffff;
            border-color: #cbd5e1;
        }

        @media (max-width: 768px) {
            .footer-hint {
                display: none;
            }
            .book-info h1 {
                max-width: 160px;
            }
        }
    </style>
</head>
<body class="light-mode">

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="javascript:window.history.back();" class="back-btn">
                <i class="fas fa-arrow-left"></i> Orqaga
            </a>
            <div class="book-info">
                <h1>{{ book.title }}</h1>
                <p>{{ book.subject.name }} • Darslik</p>
            </div>
        </div>

        <!-- Mode Switcher -->
        <div class="header-center">
            <div class="mode-toggle">
                <button type="button" class="mode-btn active" id="btn-mode-3d" onclick="switchViewMode('3d')">
                    <i class="fas fa-book-open"></i> 3D Kitob
                </button>
                <button type="button" class="mode-btn" id="btn-mode-scroll" onclick="switchViewMode('scroll')">
                    <i class="fas fa-scroll"></i> Ketma-ket
                </button>
            </div>
        </div>

        <div class="header-right">
            <button class="control-icon-btn" id="zoom-out-btn" title="Kichiklashtirish">
                <i class="fas fa-minus"></i>
            </button>
            <button class="control-icon-btn" id="zoom-in-btn" title="Kattalashtirish">
                <i class="fas fa-plus"></i>
            </button>
            <button class="control-icon-btn" id="theme-toggle" title="Mavzuni o'zgartirish">
                <i class="fas fa-moon"></i>
            </button>
            <button class="control-icon-btn" id="fullscreen-toggle" title="To'liq ekran">
                <i class="fas fa-expand"></i>
            </button>
            <a href="{{ book.file.url }}" download class="control-icon-btn" title="PDF yuklab olish">
                <i class="fas fa-download"></i>
            </a>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <!-- 3D Book Stage -->
        <div class="stage-3d" id="stage-3d">
            <div class="book-container" id="book-container">
                <div class="book" id="book-viewport">
                    <!-- Sheets rendered dynamically via JS -->
                </div>
            </div>
        </div>

        <!-- Continuous Scroll Stage -->
        <div class="stage-scroll" id="stage-scroll">
            <!-- Scroll cards rendered dynamically via JS -->
        </div>
    </div>

    <!-- Footer Controls -->
    <footer id="reader-footer">
        <div class="footer-hint">
            <i class="fas fa-keyboard"></i> Varaqlash: ◄ ► o'q tugmalari
        </div>

        <div class="controls-inner">
            <button class="page-nav-btn" id="prev-btn" disabled>
                <i class="fas fa-chevron-left"></i> Oldingi
            </button>
            
            <div class="page-indicator">
                <input type="number" class="page-input" id="page-input" value="1" min="1">
                <span>/ <span id="total-pages">0</span></span>
            </div>

            <button class="page-nav-btn" id="next-btn" disabled>
                Keyingi <i class="fas fa-chevron-right"></i>
            </button>
        </div>

        <div style="width: 120px;"></div>
    </footer>

    <script>
        // PDF Parameters
        const pdfUrl = "{{ book.file.url }}";
        let pdfDoc = null;
        let totalPages = 0;
        let totalSheets = 0;
        let currentSheetIndex = 0;
        let zoomScale = 1.0;
        let sheets = [];
        let currentMode = '3d';
        let scrollRenderedPages = new Set();

        // Elements
        const bookViewport = document.getElementById('book-viewport');
        const bookContainer = document.getElementById('book-container');
        const stage3D = document.getElementById('stage-3d');
        const stageScroll = document.getElementById('stage-scroll');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInput = document.getElementById('page-input');
        const totalPagesSpan = document.getElementById('total-pages');
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const fullscreenToggle = document.getElementById('fullscreen-toggle');
        const btnMode3D = document.getElementById('btn-mode-3d');
        const btnModeScroll = document.getElementById('btn-mode-scroll');
        const readerFooter = document.getElementById('reader-footer');

        // Loading PDF Document
        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
            pdfDoc = pdf;
            totalPages = pdf.numPages;
            // Sheet 0 contains Page 1 (Front) and Page 2 (Back)
            // Sheet 1 contains Page 3 (Front) and Page 4 (Back), etc.
            totalSheets = Math.ceil(totalPages / 2);

            totalPagesSpan.textContent = totalPages;
            pageInput.max = totalPages;

            buildFlipbook();
            buildScrollStage();
            goToSheet(0);
        }).catch(function(error) {
            console.error('Error loading PDF: ', error);
            bookViewport.innerHTML = `<div style="color:#ff4f4f; padding: 25px; font-weight: 700; text-align: center;">PDF kitobni yuklashda xatolik yuz berdi: ${error.message}</div>`;
        });

        // Build 3D Flipbook Sheets
        function buildFlipbook() {
            bookViewport.innerHTML = '';
            sheets = [];

            for (let i = 0; i < totalSheets; i++) {
                const frontPageNum = i * 2 + 1;
                const backPageNum = i * 2 + 2;

                const sheet = document.createElement('div');
                sheet.className = 'sheet';
                sheet.dataset.index = i;

                // Front Face
                const frontFace = document.createElement('div');
                frontFace.className = 'face front';
                if (frontPageNum <= totalPages) {
                    frontFace.appendChild(createCanvasPlaceholder(frontPageNum));
                } else {
                    frontFace.innerHTML = '<div style="opacity: 0.15; font-size: 36px;"><i class="fas fa-book"></i></div>';
                }

                // Back Face
                const backFace = document.createElement('div');
                backFace.className = 'face back';
                if (backPageNum <= totalPages) {
                    backFace.appendChild(createCanvasPlaceholder(backPageNum));
                } else {
                    backFace.innerHTML = '<div style="opacity: 0.15; font-size: 36px;"><i class="fas fa-book"></i></div>';
                }

                sheet.appendChild(frontFace);
                sheet.appendChild(backFace);
                bookViewport.appendChild(sheet);
                sheets.push(sheet);
            }

            // Bind click events on sheets for turning pages
            sheets.forEach((sheet, idx) => {
                sheet.addEventListener('click', function(e) {
                    if (e.target.closest('a') || e.target.closest('button') || e.target.closest('input')) return;

                    if (idx < currentSheetIndex) {
                        // Clicked on left side -> Turn back
                        goToSheet(currentSheetIndex - 1);
                    } else if (idx === currentSheetIndex) {
                        // Clicked on right side -> Turn next
                        goToSheet(currentSheetIndex + 1);
                    }
                });
            });
        }

        function createCanvasPlaceholder(pageNum) {
            const container = document.createElement('div');
            container.style.position = 'relative';
            container.style.width = '100%';
            container.style.height = '100%';
            container.style.display = 'flex';
            container.style.justifyContent = 'center';
            container.style.alignItems = 'center';

            const loader = document.createElement('div');
            loader.className = 'page-loading';
            loader.innerHTML = `
                <div class="spinner"></div>
                <div>${pageNum}-bet...</div>
            `;
            container.appendChild(loader);

            const canvas = document.createElement('canvas');
            canvas.dataset.page = pageNum;
            canvas.style.display = 'none';
            container.appendChild(canvas);

            return container;
        }

        // Navigation in 3D
        function goToSheet(index) {
            if (index < 0 || index > totalSheets) return;

            currentSheetIndex = index;

            // Positioning:
            // Closed cover (Sheet 0): shift -25% to center the front cover
            // Open spread (0 < index < totalSheets): centered at 0%
            // Closed back (index === totalSheets): shift 25% to center the back cover
            let translateX = 0;
            if (currentSheetIndex === 0) translateX = -25;
            else if (currentSheetIndex === totalSheets) translateX = 25;

            applyZoom(translateX);

            // Z-Index and Animation classes
            sheets.forEach((sheet, idx) => {
                if (idx < currentSheetIndex) {
                    sheet.style.zIndex = idx + 1;
                    sheet.classList.add('flipped');
                } else {
                    sheet.style.zIndex = totalSheets - idx + 10;
                    sheet.classList.remove('flipped');
                }
            });

            // Update bottom panel controls
            prevBtn.disabled = currentSheetIndex === 0;
            nextBtn.disabled = currentSheetIndex === totalSheets;

            // Calculate active visible page number
            let activePage = 1;
            if (currentSheetIndex === 0) {
                activePage = 1;
            } else if (currentSheetIndex === totalSheets) {
                activePage = totalPages;
            } else {
                activePage = currentSheetIndex * 2;
            }
            pageInput.value = Math.min(activePage, totalPages);

            // Lazy Load Pages
            lazyLoadPages();
        }

        function lazyLoadPages() {
            if (!pdfDoc) return;
            const visibleSheets = [currentSheetIndex - 1, currentSheetIndex, currentSheetIndex + 1];
            
            visibleSheets.forEach(sheetIdx => {
                if (sheetIdx >= 0 && sheetIdx < totalSheets && sheets[sheetIdx]) {
                    const sheet = sheets[sheetIdx];
                    const canvases = sheet.querySelectorAll('canvas');
                    
                    canvases.forEach(canvas => {
                        const pageNum = parseInt(canvas.dataset.page);
                        if (pageNum && pageNum <= totalPages) {
                            loadAndRenderPage(pageNum, canvas);
                        }
                    });
                }
            });
        }

        function loadAndRenderPage(pageNum, canvas) {
            if (canvas.dataset.rendered === 'true' || canvas.dataset.rendering === 'true') return;
            canvas.dataset.rendering = 'true';
            
            pdfDoc.getPage(pageNum).then(function(page) {
                const viewport = page.getViewport({ scale: 2.0 });
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(function() {
                    canvas.dataset.rendered = 'true';
                    canvas.dataset.rendering = 'false';
                    canvas.style.display = 'block';
                    
                    const loader = canvas.parentElement.querySelector('.page-loading');
                    if (loader) loader.style.display = 'none';
                });
            }).catch(function(err) {
                console.error("Error rendering page: " + pageNum, err);
                canvas.dataset.rendering = 'false';
            });
        }

        // Build Continuous Scroll Mode
        function buildScrollStage() {
            stageScroll.innerHTML = '';
            for (let p = 1; p <= totalPages; p++) {
                const card = document.createElement('div');
                card.className = 'scroll-card';
                card.id = `scroll-page-${p}`;

                const canvas = document.createElement('canvas');
                canvas.dataset.page = p;
                card.appendChild(canvas);

                const badge = document.createElement('div');
                badge.className = 'scroll-badge';
                badge.textContent = `${p} / ${totalPages}`;
                card.appendChild(badge);

                stageScroll.appendChild(card);
            }

            setupScrollObserver();
        }

        let scrollObserver = null;
        function setupScrollObserver() {
            if (scrollObserver) scrollObserver.disconnect();

            scrollObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const canvas = entry.target.querySelector('canvas');
                        if (canvas) {
                            const pageNum = parseInt(canvas.dataset.page);
                            if (pageNum && !scrollRenderedPages.has(pageNum)) {
                                scrollRenderedPages.add(pageNum);
                                loadAndRenderPage(pageNum, canvas);
                            }
                        }
                    }
                });
            }, {
                root: stageScroll,
                rootMargin: '400px 0px 400px 0px',
                threshold: 0.01
            });

            document.querySelectorAll('.scroll-card').forEach(el => scrollObserver.observe(el));
        }

        function switchViewMode(mode) {
            currentMode = mode;
            if (mode === '3d') {
                btnMode3D.classList.add('active');
                btnModeScroll.classList.remove('active');
                stage3D.style.display = 'flex';
                stageScroll.classList.remove('active');
                readerFooter.style.display = 'flex';
            } else {
                btnMode3D.classList.remove('active');
                btnModeScroll.classList.add('active');
                stage3D.style.display = 'none';
                stageScroll.classList.add('active');
                readerFooter.style.display = 'none';
                if (stageScroll.children.length > 0) {
                    setupScrollObserver();
                }
            }
        }

        function applyZoom(customTranslateX = null) {
            let tx = customTranslateX;
            if (tx === null) {
                if (currentSheetIndex === 0) tx = -25;
                else if (currentSheetIndex === totalSheets) tx = 25;
                else tx = 0;
            }
            bookContainer.style.transform = `translateX(${tx}%) scale(${zoomScale})`;
        }

        // Control Panel Listeners
        prevBtn.addEventListener('click', () => {
            goToSheet(currentSheetIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            goToSheet(currentSheetIndex + 1);
        });

        pageInput.addEventListener('change', () => {
            let val = parseInt(pageInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > totalPages) val = totalPages;
            pageInput.value = val;

            if (currentMode === '3d') {
                let targetSheet = 0;
                if (val === 1) targetSheet = 0;
                else targetSheet = Math.floor(val / 2);
                goToSheet(targetSheet);
            } else {
                const card = document.getElementById(`scroll-page-${val}`);
                if (card) card.scrollIntoView({ behavior: 'smooth' });
            }
        });

        // Zoom Controls
        zoomInBtn.addEventListener('click', () => {
            if (zoomScale < 1.7) {
                zoomScale += 0.15;
                applyZoom();
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (zoomScale > 0.6) {
                zoomScale -= 0.15;
                applyZoom();
            }
        });

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggle.innerHTML = isLight ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-moon"></i>';
        });

        // Fullscreen Toggle
        fullscreenToggle.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenToggle.innerHTML = '<i class="fas fa-compress"></i>';
                }).catch(()=>{});
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenToggle.innerHTML = '<i class="fas fa-expand"></i>';
                }).catch(()=>{});
            }
        });

        // Keyboard Support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                if (currentMode === '3d') goToSheet(currentSheetIndex - 1);
            } else if (e.key === 'ArrowRight') {
                if (currentMode === '3d') goToSheet(currentSheetIndex + 1);
            }
        });
    </script>
</body>
</html>
