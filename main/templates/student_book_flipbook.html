<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ book.title }} - 3D O'qish</title>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';
    </script>

    <style>
        :root {
            --bg-color: #070a13;
            --panel-bg: rgba(15, 23, 42, 0.45);
            --panel-border: rgba(255, 255, 255, 0.08);
            --primary-glow: rgba(0, 255, 170, 0.3);
            --text-color: #f8fafc;
            --accent-color: #00ffaa;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --book-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
        }

        body.light-mode {
            --bg-color: #f1f5f9;
            --panel-bg: rgba(255, 255, 255, 0.8);
            --panel-border: rgba(0, 0, 0, 0.08);
            --primary-glow: rgba(2, 132, 199, 0.15);
            --text-color: #0f172a;
            --accent-color: #0284c7;
            --shadow-color: rgba(0, 0, 0, 0.15);
            --book-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: background-color 0.3s, color 0.3s;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background: var(--panel-bg);
            border-bottom: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            box-shadow: 0 4px 30px var(--shadow-color);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .back-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 10px 18px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--accent-color);
            color: #070a13;
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: transparent;
        }

        .book-info h1 {
            font-size: 18px;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .book-info p {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
        body.light-mode .book-info p {
            color: #64748b;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .control-icon-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            width: 42px;
            height: 42px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .control-icon-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            color: var(--accent-color);
        }

        /* --- MAIN WORKSPACE --- */
        .workspace {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            perspective: 2000px;
            overflow: hidden;
            padding: 40px;
        }

        /* --- 3D BOOK ENGINE --- */
        .book-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.3s ease;
        }

        .book {
            position: relative;
            width: 900px; /* Double page width */
            height: 600px; /* Page height */
            transform-style: preserve-3d;
            box-shadow: var(--book-shadow);
            border-radius: 8px;
            transition: transform 0.5s ease;
        }

        /* Hard Cover styles */
        .book::before {
            content: '';
            position: absolute;
            width: 100%;
            height: 100%;
            left: 0;
            top: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.1) 49%, rgba(0,0,0,0.4) 50%, rgba(0,0,0,0.1) 51%, rgba(0,0,0,0.2) 100%);
            z-index: 500;
            pointer-events: none;
            border-radius: 8px;
        }

        .sheet {
            position: absolute;
            right: 0;
            top: 0;
            width: 50%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
        }

        .sheet.flipped {
            transform: rotateY(-180deg);
        }

        .face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background-color: #ffffff;
            box-shadow: inset 3px 0 20px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .face.front {
            z-index: 2;
            transform: rotateY(0deg);
            border-top-right-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .face.back {
            transform: rotateY(180deg);
            border-top-left-radius: 8px;
            border-bottom-left-radius: 8px;
            box-shadow: inset -3px 0 20px rgba(0, 0, 0, 0.1);
        }

        /* Spine shadow overlay */
        .face::after {
            content: '';
            position: absolute;
            top: 0;
            width: 30px;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .face.front::after {
            left: 0;
            background: linear-gradient(to right, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
        }

        .face.back::after {
            right: 0;
            background: linear-gradient(to left, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0) 100%);
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background-color: #fff;
        }

        /* Blank/Loading state */
        .page-loading {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            color: #64748b;
            font-size: 13px;
        }

        .spinner {
            width: 30px;
            height: 30px;
            border: 3px solid rgba(0,0,0,0.1);
            border-top-color: var(--accent-color);
            border-radius: 50%;
            animation: spin 1s infinite linear;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Cover Design */
        .cover-page {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }

        .cover-page h2 {
            font-size: 24px;
            font-weight: 800;
            margin-top: 40px;
        }

        .cover-page .author {
            font-size: 14px;
            color: var(--accent-color);
            font-weight: 600;
        }

        .cover-page .logo {
            font-size: 32px;
            color: rgba(255,255,255,0.1);
            margin-bottom: 20px;
        }

        /* --- BOTTOM CONTROLS --- */
        footer {
            padding: 15px 30px;
            background: var(--panel-bg);
            border-top: 1px solid var(--panel-border);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 -4px 30px var(--shadow-color);
        }

        .controls-inner {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .page-nav-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--panel-border);
            color: var(--text-color);
            padding: 10px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .page-nav-btn:hover:not(:disabled) {
            background: var(--accent-color);
            color: #070a13;
            box-shadow: 0 0 15px var(--primary-glow);
            border-color: transparent;
        }

        .page-nav-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .page-indicator {
            font-size: 14px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .page-input {
            width: 50px;
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: rgba(0,0,0,0.3);
            color: white;
            text-align: center;
            font-weight: 700;
            font-size: 13px;
            outline: none;
        }
        body.light-mode .page-input {
            background: #ffffff;
            color: #0f172a;
        }

        .zoom-controls {
            display: flex;
            align-items: center;
            gap: 5px;
            border-left: 1px solid var(--panel-border);
            padding-left: 20px;
            margin-left: 10px;
        }

        /* Keyboard Hints */
        .keyboard-hint {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 11px;
            color: rgba(255,255,255,0.6);
            display: flex;
            gap: 15px;
            pointer-events: none;
            animation: fadeOut 4s forwards;
            backdrop-filter: blur(5px);
        }

        @keyframes fadeOut {
            0% { opacity: 1; }
            70% { opacity: 1; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-left">
            <a href="javascript:window.close();" class="back-btn">
                <i class="fas fa-arrow-left"></i> Yopish
            </a>
            <div class="book-info">
                <h1>{{ book.title }}</h1>
                <p>{{ book.subject.name }} • O'quvchi kutubxonasi</p>
            </div>
        </div>
        <div class="header-right">
            <button class="control-icon-btn" id="theme-toggle" title="Mavzuni o'zgartirish">
                <i class="fas fa-moon"></i>
            </button>
            <button class="control-icon-btn" id="fullscreen-toggle" title="To'liq ekran">
                <i class="fas fa-expand"></i>
            </button>
        </div>
    </header>

    <!-- Workspace -->
    <div class="workspace">
        <div class="book-container" id="book-container">
            <div class="book" id="book-viewport">
                <!-- Sheets will be loaded dynamically via Javascript -->
            </div>
        </div>

        <div class="keyboard-hint">
            <span><i class="fas fa-keyboard"></i> Varaqlash uchun chap/o'ng o'q tugmalaridan foydalaning</span>
        </div>
    </div>

    <!-- Footer Controls -->
    <footer>
        <div class="controls-inner">
            <button class="page-nav-btn" id="prev-btn" disabled>
                <i class="fas fa-chevron-left"></i> Oldingi
            </button>
            
            <div class="page-indicator">
                <input type="number" class="page-input" id="page-input" value="1" min="1">
                <span>/ <span id="total-pages">0</span></span>
            </div>

            <button class="page-nav-btn" id="next-btn" disabled>
                Keyingi <i class="fas fa-chevron-right"></i>
            </button>

            <div class="zoom-controls">
                <button class="control-icon-btn" id="zoom-out-btn" title="Kichiklashtirish">
                    <i class="fas fa-minus"></i>
                </button>
                <button class="control-icon-btn" id="zoom-in-btn" title="Kattalashtirish">
                    <i class="fas fa-plus"></i>
                </button>
            </div>
        </div>
    </footer>

    <script>
        // PDF Parameters
        const pdfUrl = "{{ book.file.url }}";
        let pdfDoc = null;
        let totalPages = 0;
        let totalSheets = 0;
        let currentSheetIndex = 0; // 0 is cover
        let zoomScale = 1.0;

        // Elements
        const bookViewport = document.getElementById('book-viewport');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');
        const pageInput = document.getElementById('page-input');
        const totalPagesSpan = document.getElementById('total-pages');
        const bookContainer = document.getElementById('book-container');
        const zoomInBtn = document.getElementById('zoom-in-btn');
        const zoomOutBtn = document.getElementById('zoom-out-btn');
        const themeToggle = document.getElementById('theme-toggle');
        const fullscreenToggle = document.getElementById('fullscreen-toggle');

        // Loading PDF Document
        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
            pdfDoc = pdf;
            totalPages = pdf.numPages;
            totalSheets = Math.ceil((totalPages + 1) / 2); // Page 1 is cover, subsequent sheets contain 2 pages each

            totalPagesSpan.textContent = totalPages;
            pageInput.max = totalPages;

            buildFlipbook();
            goToSheet(0);
        }).catch(function(error) {
            console.error('Error loading PDF: ', error);
            bookViewport.innerHTML = `<div style="color:#ff4f4f; padding: 20px; font-weight: 700; text-align: center;">PDF kitobni yuklashda xatolik yuz berdi: ${error.message}</div>`;
        });

        // Building HTML elements for the flipbook
        let sheets = [];
        function buildFlipbook() {
            bookViewport.innerHTML = '';
            sheets = [];

            // Cover Sheet (Sheet 0)
            // Front: Book Cover, Back: Blank or Page 2
            const coverSheet = createSheetHTML(0, 1, 2);
            bookViewport.appendChild(coverSheet);
            sheets.push(coverSheet);

            // Subsequent Sheets
            for (let i = 1; i < totalSheets; i++) {
                const frontPageNum = i * 2 + 1;
                const backPageNum = i * 2 + 2;
                
                const sheet = createSheetHTML(i, frontPageNum, backPageNum);
                bookViewport.appendChild(sheet);
                sheets.push(sheet);
            }

            // Bind click events on sheets for turning pages
            sheets.forEach((sheet, idx) => {
                sheet.addEventListener('click', function(e) {
                    // Prevent flipping if clicked on download button or similar
                    if (e.target.closest('a') || e.target.closest('button')) return;

                    const rect = sheet.getBoundingClientRect();
                    const clickX = e.clientX - rect.left;
                    
                    if (idx < currentSheetIndex) {
                        // Clicked on flipped sheet (left side of the book)
                        // Go back
                        goToSheet(currentSheetIndex - 1);
                    } else if (idx === currentSheetIndex) {
                        // Clicked on active sheet (right side of the book)
                        // Go next
                        goToSheet(currentSheetIndex + 1);
                    }
                });
            });
        }

        function createSheetHTML(sheetIndex, frontPageNum, backPageNum) {
            const sheet = document.createElement('div');
            sheet.className = 'sheet';
            sheet.dataset.index = sheetIndex;

            // Front Face
            const frontFace = document.createElement('div');
            frontFace.className = 'face front';
            if (sheetIndex === 0) {
                // Book cover design
                frontFace.innerHTML = `
                    <div class="cover-page">
                        <div class="logo"><i class="fas fa-graduation-cap"></i></div>
                        <h2>{{ book.title }}</h2>
                        <div class="author">Fan darsligi</div>
                        <p style="font-size:11px; opacity:0.6;">O'qish uchun bosing <i class="fas fa-chevron-right"></i></p>
                    </div>
                `;
            } else if (frontPageNum <= totalPages) {
                frontFace.appendChild(createCanvasPlaceholder(frontPageNum));
            } else {
                frontFace.innerHTML = '<div style="opacity: 0.1;"><i class="fas fa-book-open" style="font-size:40px;"></i></div>';
            }

            // Back Face
            const backFace = document.createElement('div');
            backFace.className = 'face back';
            if (backPageNum <= totalPages) {
                backFace.appendChild(createCanvasPlaceholder(backPageNum));
            } else {
                backFace.innerHTML = '<div style="opacity: 0.1;"><i class="fas fa-book-open" style="font-size:40px;"></i></div>';
            }

            sheet.appendChild(frontFace);
            sheet.appendChild(backFace);
            return sheet;
        }

        function createCanvasPlaceholder(pageNum) {
            const container = document.createElement('div');
            container.style.position = 'relative';
            container.style.width = '100%';
            container.style.height = '100%';
            container.style.display = 'flex';
            container.style.justifyContent = 'center';
            container.style.alignItems = 'center';

            const loader = document.createElement('div');
            loader.className = 'page-loading';
            loader.innerHTML = `
                <div class="spinner"></div>
                <div>Sahifa ${pageNum}...</div>
            `;
            container.appendChild(loader);

            const canvas = document.createElement('canvas');
            canvas.dataset.page = pageNum;
            canvas.style.display = 'none';
            container.appendChild(canvas);

            return container;
        }

        // Navigation
        function goToSheet(index) {
            if (index < 0 || index >= totalSheets) return;

            currentSheetIndex = index;
            
            // Z-Index and Animation classes
            sheets.forEach((sheet, idx) => {
                if (idx < currentSheetIndex) {
                    sheet.style.zIndex = idx;
                    sheet.classList.add('flipped');
                } else {
                    sheet.style.zIndex = totalSheets - idx;
                    sheet.classList.remove('flipped');
                }
            });

            // Update bottom panel controls
            prevBtn.disabled = currentSheetIndex === 0;
            nextBtn.disabled = currentSheetIndex === totalSheets - 1;

            // Calculate active visible pages
            let activePage = 1;
            if (currentSheetIndex > 0) {
                activePage = currentSheetIndex * 2;
            }
            pageInput.value = Math.min(activePage, totalPages);

            // Lazy Load Pages
            lazyLoadPages();
        }

        function lazyLoadPages() {
            // Load pages for: current sheet, previous sheet, and next sheet
            const visibleSheets = [currentSheetIndex, currentSheetIndex - 1, currentSheetIndex + 1];
            
            visibleSheets.forEach(sheetIdx => {
                if (sheetIdx < 0 || sheetIdx >= totalSheets) return;
                
                const sheet = sheets[sheetIdx];
                const canvases = sheet.querySelectorAll('canvas');
                
                canvases.forEach(canvas => {
                    const pageNum = parseInt(canvas.dataset.page);
                    if (pageNum && pageNum <= totalPages) {
                        loadAndRenderPage(pageNum, canvas);
                    }
                });
            });
        }

        function loadAndRenderPage(pageNum, canvas) {
            if (canvas.dataset.rendered === 'true' || canvas.dataset.rendering === 'true') return;

            canvas.dataset.rendering = 'true';
            
            pdfDoc.getPage(pageNum).then(function(page) {
                // Render at high resolution scale for sharp text
                const viewport = page.getViewport({ scale: 1.8 });
                const context = canvas.getContext('2d');
                canvas.width = viewport.width;
                canvas.height = viewport.height;

                const renderContext = {
                    canvasContext: context,
                    viewport: viewport
                };

                page.render(renderContext).promise.then(function() {
                    canvas.dataset.rendered = 'true';
                    canvas.dataset.rendering = 'false';
                    canvas.style.display = 'block';
                    
                    // Hide loader spinner
                    const loader = canvas.parentElement.querySelector('.page-loading');
                    if (loader) loader.style.display = 'none';
                });
            }).catch(function(err) {
                console.error("Error rendering page: " + pageNum, err);
                canvas.dataset.rendering = 'false';
            });
        }

        // Control Panel Listeners
        prevBtn.addEventListener('click', () => {
            goToSheet(currentSheetIndex - 1);
        });

        nextBtn.addEventListener('click', () => {
            goToSheet(currentSheetIndex + 1);
        });

        pageInput.addEventListener('change', () => {
            let val = parseInt(pageInput.value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > totalPages) val = totalPages;
            
            pageInput.value = val;

            // Map page number to sheet index
            // Page 1 is on Sheet 0
            // Page 2 & 3 are on Sheet 1
            // Page 4 & 5 are on Sheet 2, etc.
            let targetSheet = 0;
            if (val > 1) {
                targetSheet = Math.floor(val / 2);
            }
            goToSheet(targetSheet);
        });

        // Zoom Controls
        zoomInBtn.addEventListener('click', () => {
            if (zoomScale < 1.6) {
                zoomScale += 0.15;
                bookContainer.style.transform = `scale(${zoomScale})`;
            }
        });

        zoomOutBtn.addEventListener('click', () => {
            if (zoomScale > 0.6) {
                zoomScale -= 0.15;
                bookContainer.style.transform = `scale(${zoomScale})`;
            }
        });

        // Theme Toggle
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            themeToggle.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        // Fullscreen Toggle
        fullscreenToggle.addEventListener('click', () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().then(() => {
                    fullscreenToggle.innerHTML = '<i class="fas fa-compress"></i>';
                });
            } else {
                document.exitFullscreen().then(() => {
                    fullscreenToggle.innerHTML = '<i class="fas fa-expand"></i>';
                });
            }
        });

        // Keyboard Support
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') {
                goToSheet(currentSheetIndex - 1);
            } else if (e.key === 'ArrowRight') {
                goToSheet(currentSheetIndex + 1);
            }
        });
    </script>
</body>
</html>
